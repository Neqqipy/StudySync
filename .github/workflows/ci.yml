name: StudySync CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Lint & Test (Frontend Static UI)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root and workspace dependencies
        run: npm run setup

      - name: Run Linter (TypeScript strict check)
        run: npm run lint

      - name: Run Automated Unit Tests (BR1, BR2, BR4 & Parsers)
        run: npm run test

      - name: Build Production Bundles (Server & Client)
        run: npm run build
